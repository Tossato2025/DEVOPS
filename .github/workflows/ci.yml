name: Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js (JavaScript)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar integridade dos arquivos
        run: |
          echo "Verificando se os arquivos base da calculadora existem..."
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Testes aprovados! Código íntegro."